[project]
name = "yt-dlp-gui"
version = "0.1.0"
description = "A small always-on-top desktop widget to download videos with yt-dlp"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yt-dlp-gui contributors" }]
dependencies = [
    # Essentials is enough for QtCore/QtGui/QtWidgets/QtNetwork and is far
    # smaller than the full PySide6 meta-package (which adds WebEngine/PDF).
    "PySide6-Essentials>=6.11",
]

[project.scripts]
yt-dlp-gui = "yt_dlp_gui.__main__:main"

[tool.poetry]
packages = [{ include = "yt_dlp_gui" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-qt = ">=4.4"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that download from the internet (opt-in)",
]
